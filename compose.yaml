services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/dev.db
      - DATABASE_URL_SYNC=sqlite:////app/data/dev.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - APP_DEBUG=${APP_DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
